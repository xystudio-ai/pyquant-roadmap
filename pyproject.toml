[project]
name = "pyquant-roadmap"
version = "0.1.0"
description = "Open-source Python quant trading roadmap notebooks and MVP library."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1,<3.0",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "pyarrow>=14",
  "pyyaml>=6",
  "akshare>=1.13",
  "bt>=1.0.0",
  "quantstats>=0.0.81",
  "ta>=0.11.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
